<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="SoTube source code in VS Code">
  <defs>
    <linearGradient id="searchBtn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41b9f6"/>
      <stop offset="1" stop-color="#2a8fd0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="winshape"><rect width="1080" height="720" rx="10"/></clipPath>
  </defs>

  <rect width="1200" height="760" fill="#0d0d0d"/>
  <g filter="url(#shadow)">
    <g clip-path="url(#winshape)">
      <!-- Window background -->
      <rect x="60" y="20" width="1080" height="720" fill="#1e1e1e"/>

      <!-- Title bar -->
      <rect x="60" y="20" width="1080" height="34" fill="#323233"/>
      <g fill="none" stroke="#b0b6bf" stroke-width="1.4" stroke-linecap="round">
        <line x1="78" y1="37" x2="88" y2="37"/>
        <rect x="82" y="32" width="12" height="10" rx="1"/>
        <line x1="106" y1="33" x2="118" y2="45"/><line x1="118" y1="33" x2="106" y2="45"/>
      </g>
      <text x="600" y="41" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#d4d4d4" text-anchor="middle">main.js — SoTube — Visual Studio Code</text>
      <rect x="960" y="27" width="160" height="20" rx="5" fill="#252526"/>
      <circle cx="1005" cy="37" r="4" fill="none" stroke="#6a6a6a" stroke-width="1.2"/>

      <!-- Activity bar -->
      <rect x="60" y="54" width="46" height="686" fill="#333"/>
      <g fill="none" stroke="#858585" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M79 92 l5 -6 l5 6 v10 h-10 Z"/>
        <circle cx="84" cy="124" r="6"/><line x1="88" y1="128" x2="94" y2="134"/>
        <path d="M76 158 h16 v14 h-16 z M84 158 v6 h6"/>
        <circle cx="84" cy="212" r="3"/><line x1="84" y1="215" x2="84" y2="222"/>
        <circle cx="93" cy="222" r="2.4"/>
        <rect x="77" y="248" width="14" height="12" rx="1"/>
        <path d="M81 276 l7 5 l-7 5 Z"/>
        <path d="M79 312 l5 -5 l5 5 l-5 5 Z"/>
      </g>

      <!-- Explorer drawer -->
      <rect x="106" y="54" width="250" height="686" fill="#252526"/>
      <text x="122" y="78" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#bbbbbb" letter-spacing="1">EXPLORER</text>
      <line x1="106" y1="86" x2="356" y2="86" stroke="#3a3a3a"/>
      <line x1="106" y1="104" x2="356" y2="104" stroke="#3a3a3a"/>
      <text x="126" y="124" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cccccc">▾ SOTUBE</text>

      <!-- Tree -->
      <g font-family="Segoe UI, sans-serif" font-size="12.5">
        <!-- indented helper -->
        <!-- .github -->
        <g>
          <path d="M128 140 l4 0 1.6 2 5 0" fill="none" stroke="#9aa5b4" stroke-width="1.2"/>
          <rect x="142" y="138" width="13" height="10" rx="1.5" fill="#c09553"/>
          <path d="M144 140 h4.5 l2 2 h6.5" fill="none" stroke="#c09553" stroke-width="1.2"/>
          <text x="164" y="148" fill="#d4d4d4">.github</text>
        </g>
        <!-- api -->
        <g>
          <path d="M128 162 l4 0 1.6 2 5 0" fill="none" stroke="#9aa5b4" stroke-width="1.2"/>
          <rect x="142" y="160" width="13" height="10" rx="1.5" fill="#c09553"/>
          <path d="M144 162 h4.5 l2 2 h6.5" fill="none" stroke="#c09553" stroke-width="1.2"/>
          <text x="164" y="170" fill="#d4d4d4">api</text>
        </g>
        <!-- convertapi -->
        <g>
          <path d="M128 184 l4 0 1.6 2 5 0" fill="none" stroke="#9aa5b4" stroke-width="1.2"/>
          <rect x="142" y="182" width="13" height="10" rx="1.5" fill="#c09553"/>
          <path d="M144 184 h4.5 l2 2 h6.5" fill="none" stroke="#c09553" stroke-width="1.2"/>
          <text x="164" y="192" fill="#d4d4d4">convertapi</text>
        </g>
        <!-- assets -->
        <g>
          <rect x="152" y="204" width="13" height="10" rx="1.5" fill="#c09553"/>
          <path d="M154 206 h4.5 l2 2 h6.5" fill="none" stroke="#c09553" stroke-width="1.2"/>
          <text x="174" y="214" fill="#d4d4d4">assets</text>
        </g>
        <!-- locales -->
        <g>
          <rect x="152" y="226" width="13" height="10" rx="1.5" fill="#c09553"/>
          <path d="M154 228 h4.5 l2 2 h6.5" fill="none" stroke="#c09553" stroke-width="1.2"/>
          <text x="174" y="236" fill="#d4d4d4">locales</text>
        </g>
        <!-- pages -->
        <g>
          <rect x="152" y="248" width="13" height="10" rx="1.5" fill="#c09553"/>
          <path d="M154 250 h4.5 l2 2 h6.5" fill="none" stroke="#c09553" stroke-width="1.2"/>
          <text x="174" y="258" fill="#d4d4d4">pages</text>
        </g>
        <!-- scripts -->
        <g>
          <rect x="152" y="270" width="13" height="10" rx="1.5" fill="#c09553"/>
          <path d="M154 272 h4.5 l2 2 h6.5" fill="none" stroke="#c09553" stroke-width="1.2"/>
          <text x="174" y="280" fill="#d4d4d4">scripts</text>
        </g>
        <!-- settings -->
        <g>
          <rect x="152" y="292" width="13" height="10" rx="1.5" fill="#c09553"/>
          <path d="M154 294 h4.5 l2 2 h6.5" fill="none" stroke="#c09553" stroke-width="1.2"/>
          <text x="174" y="302" fill="#d4d4d4">settings</text>
        </g>
        <!-- main.js active -->
        <g>
          <rect x="146" y="314" width="180" height="20" fill="#37373d"/>
          <rect x="152" y="319" width="11" height="9" rx="1" fill="#e8a33d"/>
          <text x="168" y="328" fill="#e8a33d">JS</text>
          <text x="192" y="328" fill="#ffffff">main.js</text>
          <path d="M308 317 l3 3 -3 3" fill="none" stroke="#8a94a6" stroke-width="1.2"/>
        </g>
        <!-- renderer.js -->
        <g>
          <rect x="152" y="339" width="11" height="9" rx="1" fill="#e8a33d"/>
          <text x="168" y="348" fill="#e8a33d">JS</text>
          <text x="192" y="348" fill="#d4d4d4">renderer.js</text>
        </g>
        <!-- package.json -->
        <g>
          <rect x="152" y="361" width="11" height="9" rx="1" fill="#e3793d"/>
          <text x="168" y="370" fill="#e3793d"></text>
          <text x="168" y="370" fill="#d4d4d4">package.json</text>
        </g>
        <!-- README.md -->
        <g>
          <rect x="152" y="383" width="11" height="9" rx="1" fill="#4ea1c2"/>
          <text x="168" y="392" fill="#4ea1c2"></text>
          <text x="168" y="392" fill="#d4d4d4">README.md</text>
        </g>
      </g>

      <!-- Editor -->
      <rect x="356" y="54" width="784" height="686" fill="#1e1e1e"/>
      <!-- tab bar -->
      <g font-family="Segoe UI, sans-serif" font-size="12">
        <rect x="356" y="54" width="120" height="30" fill="#1e1e1e"/>
        <rect x="368" y="61" width="18" height="14" rx="2" fill="#e8a33d"/>
        <text x="372" y="72" font-family="Segoe UI, sans-serif" font-size="9" fill="#1e1e1e" font-weight="700">JS</text>
        <text x="392" y="73" fill="#d4d4d4">main.js</text>
        <text x="442" y="73" fill="#6e6e6e">×</text>
        <rect x="476" y="54" width="130" height="30" fill="#2d2d2d"/>
        <rect x="488" y="61" width="18" height="14" rx="2" fill="#e8a33d"/>
        <text x="492" y="72" font-family="Segoe UI, sans-serif" font-size="9" fill="#1e1e1e" font-weight="700">JS</text>
        <text x="512" y="73" fill="#9ca0a6">renderer.js</text>
        <text x="564" y="73" fill="#6e6e6e">×</text>
      </g>

      <!-- Code -->
      <g font-family="Consolas, 'Courier New', monospace" font-size="13">
        <g fill="#6e6e6e" font-size="11.5" text-anchor="end">
          <text x="372" y="106">1</text><text x="372" y="128">2</text><text x="372" y="150">3</text>
          <text x="372" y="172">4</text><text x="372" y="194">5</text><text x="372" y="216">6</text>
          <text x="372" y="238">7</text><text x="372" y="260">8</text><text x="372" y="282">9</text>
          <text x="372" y="304">10</text><text x="372" y="326">11</text><text x="372" y="348">12</text>
          <text x="372" y="370">13</text><text x="372" y="392">14</text><text x="372" y="414">15</text>
          <text x="372" y="436">16</text><text x="372" y="458">17</text>
        </g>
        <g fill="#d4d4d4">
          <text x="386" y="106"><tspan fill="#c586c0">const</tspan> { <tspan fill="#9cdcfe">app</tspan>, <tspan fill="#9cdcfe">BrowserWindow</tspan>, <tspan fill="#9cdcfe">Tray</tspan>, <tspan fill="#9cdcfe">Menu</tspan> } = <tspan fill="#c586c0">require</tspan>(<tspan fill="#ce9178">'electron'</tspan>);</text>
          <text x="386" y="128"> </text>
          <text x="386" y="150"><tspan fill="#c586c0">const</tspan> <tspan fill="#9cdcfe">path</tspan> = <tspan fill="#c586c0">require</tspan>(<tspan fill="#ce9178">'path'</tspan>);</text>
          <text x="386" y="172"><tspan fill="#c586c0">const</tspan> <tspan fill="#9cdcfe">settingsManager</tspan> = <tspan fill="#c586c0">require</tspan>(<tspan fill="#ce9178">'./settings'</tspan>);</text>
          <text x="386" y="194"><tspan fill="#6a9955">// Main window lifecycle &amp; tray</tspan></text>
          <text x="386" y="216"> </text>
          <text x="386" y="238"><tspan fill="#c586c0">function</tspan> <tspan fill="#dcdcaa">createWindow</tspan>() {</text>
          <text x="386" y="260">  <tspan fill="#c586c0">const</tspan> <tspan fill="#9cdcfe">userSettings</tspan> = <tspan fill="#9cdcfe">settingsManager</tspan>.<tspan fill="#dcdcaa">loadSettings</tspan>();</text>
          <text x="386" y="282">  <tspan fill="#c586c0">const</tspan> <tspan fill="#9cdcfe">isLight</tspan> = <tspan fill="#9cdcfe">userSettings</tspan> &amp;&amp; <tspan fill="#9cdcfe">userSettings</tspan>.<tspan fill="#9cdcfe">theme</tspan> === <tspan fill="#ce9178">'light'</tspan>;</text>
          <text x="386" y="304"> </text>
          <text x="386" y="326">  <tspan fill="#9cdcfe">mainWindow</tspan> = <tspan fill="#c586c0">new</tspan> <tspan fill="#4ec9b0">BrowserWindow</tspan>({</text>
          <text x="386" y="348">    <tspan fill="#9cdcfe">width</tspan>: <tspan fill="#b5cea8">680</tspan>,</text>
          <text x="386" y="370">    <tspan fill="#9cdcfe">height</tspan>: <tspan fill="#b5cea8">740</tspan>,</text>
          <text x="386" y="392">    <tspan fill="#9cdcfe">backgroundColor</tspan>: <tspan fill="#9cdcfe">isLight</tspan> ? <tspan fill="#ce9178">'#f3f3f3'</tspan> : <tspan fill="#ce9178">'#202020'</tspan>,</text>
          <text x="386" y="414">    <tspan fill="#9cdcfe">webPreferences</tspan>: { <tspan fill="#9cdcfe">preload</tspan>: <tspan fill="#dcdcaa">getPreloadPath</tspan>() }</text>
          <text x="386" y="436">  });</text>
          <text x="386" y="458"> </text>
        </g>
      </g>

      <!-- Minimap -->
      <rect x="1100" y="88" width="20" height="560" fill="#2a2a2a"/>
      <rect x="1102" y="96" width="16" height="290" rx="3" fill="#41b9f6" opacity="0.35"/>

      <!-- Status bar -->
      <rect x="106" y="706" width="1034" height="34" fill="#007acc"/>
      <g font-family="Segoe UI, sans-serif" font-size="11.5">
        <text x="122" y="727" fill="#ffffff">⎇ main</text>
        <circle cx="176" cy="723" r="3.5" fill="#ffffff"/><text x="186" y="727" fill="#ffffff">0</text>
        <text x="270" y="727" fill="#ffffff">⚡ 0</text>
        <text x="1080" y="727" fill="#ffffff" text-anchor="end">Ln 7, Col 25   UTF-8   LF   JavaScript</text>
      </g>
    </g>
  </g>
</svg>
