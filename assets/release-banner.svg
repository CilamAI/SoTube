<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="SoTube 26.0.0">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fc"/>
      <stop offset="0.5" stop-color="#eef1f7"/>
      <stop offset="1" stop-color="#e5eaf2"/>
    </linearGradient>
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41b9f6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fdcff"/>
      <stop offset="1" stop-color="#38a7e3"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc2ff"/>
      <stop offset="1" stop-color="#2f9fe0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#1a2f3f" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#223746" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#tint)"/>
  <circle cx="1100" cy="40" r="300" fill="#ffffff" opacity="0.5"/>
  <circle cx="1240" cy="620" r="240" fill="#bfe6ff" opacity="0.35"/>

  <!-- App icon tile -->
  <g filter="url(#glow)">
    <rect x="80" y="150" width="220" height="220" rx="54" fill="url(#logo)"/>
    <path d="M186 178 L262 260 L186 342 Z" fill="#0b2233" stroke="#0b2233" stroke-width="34" stroke-linejoin="round" paint-order="stroke"/>
    <path d="M186 178 L262 260 L186 342 Z" fill="none" stroke="#0b2233" stroke-width="2" stroke-linejoin="round" opacity="0.25"/>
  </g>

  <!-- Brand -->
  <text x="348" y="252" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="96" font-weight="700" fill="#15222e" letter-spacing="-1">SoTube</text>

  <g filter="url(#soft)">
    <rect x="360" y="278" width="160" height="46" rx="23" fill="url(#chip)"/>
  </g>
  <text x="440" y="309" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">26.0.0</text>

  <text x="360" y="376" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="24" fill="#3a4a57">A desktop client for downloading and converting media.</text>

  <!-- Feature chips -->
  <g font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" filter="url(#soft)">
    <rect x="360" y="420" width="158" height="48" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#223746" stroke-opacity="0.08"/>
    <text x="439" y="450" fill="#1f2e3a" text-anchor="middle">Download</text>
    <rect x="530" y="420" width="158" height="48" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#223746" stroke-opacity="0.08"/>
    <text x="609" y="450" fill="#1f2e3a" text-anchor="middle">Convert</text>
    <rect x="700" y="420" width="138" height="48" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#223746" stroke-opacity="0.08"/>
    <text x="769" y="450" fill="#1f2e3a" text-anchor="middle">Trim</text>
    <rect x="850" y="420" width="204" height="48" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#223746" stroke-opacity="0.08"/>
    <text x="952" y="450" fill="#1f2e3a" text-anchor="middle">7 Languages</text>
  </g>

  <text x="84" y="566" font-family="Segoe UI, sans-serif" font-size="18" fill="#64727f">Windows 11 · Inno Setup 6 · Apache License 2.0</text>
  <rect x="70" y="584" width="360" height="3" rx="1.5" fill="#41b9f6" opacity="0.7"/>
</svg>
