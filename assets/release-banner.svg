<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="SoTube 26.0.0">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1723"/>
      <stop offset="0.5" stop-color="#0e2536"/>
      <stop offset="1" stop-color="#123e56"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#41b9f6" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fdcff"/>
      <stop offset="1" stop-color="#38a7e3"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc2ff"/>
      <stop offset="1" stop-color="#2f9fe0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="32" flood-color="#06121c" flood-opacity="0.7"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#06121c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#sweep)"/>
  <circle cx="1120" cy="60" r="280" fill="#1c6d92" opacity="0.16"/>
  <circle cx="1240" cy="620" r="240" fill="#5bd6ff" opacity="0.07"/>

  <!-- App icon tile -->
  <g filter="url(#glow)">
    <rect x="80" y="150" width="220" height="220" rx="54" fill="url(#logo)"/>
    <path d="M186 178 L262 260 L186 342 Z" fill="#0b2233" stroke="#0b2233" stroke-width="34" stroke-linejoin="round" paint-order="stroke"/>
    <path d="M186 178 L262 260 L186 342 Z" fill="none" stroke="#0b2233" stroke-width="2" stroke-linejoin="round" opacity="0.25"/>
  </g>

  <!-- Brand -->
  <text x="348" y="252" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="96" font-weight="700" fill="#f6f9fc" letter-spacing="-1">SoTube</text>

  <g filter="url(#soft)">
    <rect x="360" y="278" width="160" height="46" rx="23" fill="url(#chip)"/>
  </g>
  <text x="440" y="309" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#0b2233" text-anchor="middle">26.0.0</text>

  <text x="360" y="376" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="24" fill="#d7e8f5">A desktop client for downloading and converting media.</text>

  <!-- Feature chips -->
  <g font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" filter="url(#soft)">
    <rect x="360" y="420" width="158" height="48" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="439" y="450" fill="#eef6fc" text-anchor="middle">Download</text>
    <rect x="530" y="420" width="158" height="48" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="609" y="450" fill="#eef6fc" text-anchor="middle">Convert</text>
    <rect x="700" y="420" width="138" height="48" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="769" y="450" fill="#eef6fc" text-anchor="middle">Trim</text>
    <rect x="850" y="420" width="204" height="48" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="952" y="450" fill="#eef6fc" text-anchor="middle">7 Languages</text>
  </g>

  <text x="84" y="566" font-family="Segoe UI, sans-serif" font-size="18" fill="#79a6bd">Windows 11 · Inno Setup 6 · Apache License 2.0</text>
  <rect x="70" y="584" width="360" height="3" rx="1.5" fill="#41b9f6" opacity="0.6"/>
</svg>
