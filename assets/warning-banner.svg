<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 232" role="img" aria-label="Warning: you may be being scammed">
  <defs>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c02a3f"/>
      <stop offset="0.45" stop-color="#d13a5f"/>
      <stop offset="0.8" stop-color="#7b3fa0"/>
      <stop offset="1" stop-color="#6246b0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="232" fill="url(#warn)"/>
  <text x="800" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">WARNING: YOU MAY BEING SCAMMED!</text>
  <text x="800" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#ffffff" text-anchor="middle">If you are on the phone with someone you DON&apos;T know AND TRUST who has asked you to install RustDesk,</text>
  <text x="800" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#ffffff" text-anchor="middle">do not install and hang up immediately.</text>
  <text x="800" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#ffffff" text-anchor="middle">They are likely a scammer trying to steal your money or other private information.</text>
</svg>
