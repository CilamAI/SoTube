<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 820" role="img" aria-label="SoTube screenshot">
  <defs>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a6e8a"/>
      <stop offset="1" stop-color="#0d2233"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5bd6ff"/>
      <stop offset="1" stop-color="#3aa6e0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="980" height="820" fill="#0e0e0e"/>

  <g filter="url(#shadow)">
    <rect x="130" y="30" width="720" height="760" rx="16" fill="#202020" stroke="#2f2f2f" stroke-width="1"/>

    <!-- Title bar -->
    <rect x="130" y="30" width="720" height="44" rx="16" fill="#202020"/>
    <rect x="130" y="58" width="720" height="16" fill="#202020"/>
    <g>
      <rect x="146" y="42" width="20" height="20" rx="5" fill="url(#logoBg)"/>
      <path d="M154 46.5 L161.5 51 L154 55.5 Z" fill="#0d2233" stroke="#0d2233" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="174" y="56" font-family="Segoe UI, sans-serif" font-size="14" fill="#f0f4fc">SoTube</text>
    </g>
    <g stroke="#8a94a6" stroke-width="1.2" stroke-linecap="round">
      <line x1="768" y1="52" x2="778" y2="52"/>
      <rect x="766" y="46" width="14" height="12" rx="1" fill="none"/>
      <line x1="812" y1="46.6" x2="814.4" y2="44.2"/><line x1="814.4" y1="44.2" x2="820" y2="49.8"/>
    </g>

    <!-- Sidebar -->
    <rect x="130" y="74" width="58" height="716" fill="#181818"/>
    <line x1="188" y1="74" x2="188" y2="790" stroke="#2a2a2a" stroke-width="1"/>
    <g>
      <rect x="143" y="90" width="32" height="32" rx="9" fill="url(#logoBg)"/>
      <path d="M156 100 L169 106 L156 112 Z" fill="#0d2233" stroke="#0d2233" stroke-width="2" stroke-linejoin="round"/>
      <g stroke="#41b9f6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M152 168 L159 162 L166 168 V178 H152 Z"/>
      </g>
      <g stroke="#8a94a6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="159" cy="216" r="3"/>
        <line x1="161" y1="214" x2="168" y2="207"/>
        <line x1="161" y1="218" x2="168" y2="225"/>
      </g>
      <line x1="143" y1="248" x2="173" y2="248" stroke="#2a2a2a" stroke-width="1"/>
      <g stroke="#8a94a6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="155" cy="286" r="3.4"/><line x1="159.5" y1="289" x2="164" y2="293"/>
        <circle cx="163" cy="286" r="3.4"/><line x1="158" y1="282" x2="152" y2="277"/>
        <line x1="150" y1="330" x2="168" y2="330"/><path d="M152 324 H166 V338 H152 Z"/>
      </g>
      <g stroke="#8a94a6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M153 372 L159 368 L165 372 L165 378 H153 Z"/>
        <text x="159" y="374" fill="#8a94a6" font-size="4" font-family="Segoe UI, sans-serif" text-anchor="middle" stroke="none">i</text>
      </g>
    </g>

    <!-- Content -->
    <rect x="188" y="74" width="662" height="716" fill="#202020"/>
    <text x="214" y="112" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#f0f4fc">Home</text>
    <text x="214" y="133" font-family="Segoe UI, sans-serif" font-size="12" fill="#8a94a6">Discover, download, and convert media.</text>

    <!-- Search bar -->
    <rect x="214" y="158" width="430" height="44" rx="10" fill="#2b2b2b" stroke="#3a3a3a" stroke-width="1"/>
    <circle cx="236" cy="180" r="6.5" fill="none" stroke="#8a94a6" stroke-width="1.6"/>
    <line x1="241" y1="185" x2="246" y2="190" stroke="#8a94a6" stroke-width="1.6" stroke-linecap="round"/>
    <text x="252" y="184" font-family="Segoe UI, sans-serif" font-size="13" fill="#7a8494">Paste a YouTube link or search…</text>
    <rect x="656" y="159" width="56" height="42" rx="9" fill="#41b9f6"/>
    <text x="684" y="185" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0b2030" text-anchor="middle">Go</text>
    <g font-family="Segoe UI, sans-serif" font-size="12">
      <rect x="726" y="159" width="54" height="42" rx="9" fill="#2b2b2b" stroke="#3a3a3a"/>
      <text x="753" y="185" fill="#b9c3d2" text-anchor="middle">1440p</text>
    </g>

    <!-- Result card -->
    <rect x="214" y="224" width="520" height="180" rx="12" fill="#2b2b2b" stroke="#3a3a3a" stroke-width="1"/>
    <rect x="226" y="236" width="200" height="124" rx="10" fill="url(#thumb)"/>
    <g>
      <circle cx="326" cy="298" r="24" fill="#41b9f6" opacity="0.9"/>
      <path d="M320 288 L336 298 L320 308 Z" fill="#0b2030"/>
    </g>
    <text x="442" y="264" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#f0f4fc">The SoTube Walkthrough</text>
    <text x="442" y="286" font-family="Segoe UI, sans-serif" font-size="12" fill="#8a94a6">SoTube Official · 4K · 24:31</text>
    <g font-family="Segoe UI, sans-serif" font-size="12">
      <rect x="442" y="306" width="72" height="24" rx="6" fill="#41b9f6"/>
      <text x="478" y="322" fill="#0b2030" text-anchor="middle">MP4</text>
      <rect x="522" y="306" width="72" height="24" rx="6" fill="#2b2b2b" stroke="#3a3a3a"/>
      <text x="558" y="322" fill="#b9c3d2" text-anchor="middle">MP3</text>
      <rect x="602" y="306" width="72" height="24" rx="6" fill="#2b2b2b" stroke="#3a3a3a"/>
      <text x="638" y="322" fill="#b9c3d2" text-anchor="middle">Trim</text>
    </g>
    <line x1="214" y1="426" x2="734" y2="426" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Progress -->
    <text x="214" y="456" font-family="Segoe UI, sans-serif" font-size="12" fill="#8a94a6">Downloading…</text>
    <rect x="214" y="466" width="520" height="8" rx="4" fill="#2b2b2b"/>
    <rect x="214" y="466" width="340" height="8" rx="4" fill="#41b9f6"/>
    <text x="750" y="474" font-family="Segoe UI, sans-serif" font-size="12" fill="#8a94a6" text-anchor="end">65%</text>

    <!-- Status -->
    <g font-family="Segoe UI, sans-serif" font-size="12">
      <rect x="214" y="494" width="150" height="30" rx="8" fill="#2b2b2b" stroke="#3a3a3a"/>
      <text x="230" y="513" fill="#41b9f6">● Download complete</text>
      <rect x="730" y="494" width="120" height="30" rx="8" fill="#2b2b2b" stroke="#3a3a3a"/>
      <text x="790" y="513" fill="#b9c3d2" text-anchor="middle">2 tasks queued</text>
    </g>
  </g>
</svg>
