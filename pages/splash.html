<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; img-src 'self' file: data: blob:; style-src 'self' 'unsafe-inline';">
  <title>SoTube</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      background: transparent !important;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .splash-card {
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
      border: none;
      position: relative;
      overflow: hidden;
    }

    .splash-icon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20%;
      display: block;
      box-shadow: none;
      filter: none;
      -webkit-user-drag: none;
      user-drag: none;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <img class="splash-icon" src="../assets/icon.png" alt="SoTube" onerror="if(!this.src.endsWith('icon.png')||this.src.includes('assets'))this.src='../assets/icon.png';" />
  </div>
</body>
</html>
